.spw{position:relative;width:min(78vw,320px);margin:0 auto}
.sph{position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle,rgba(240,207,122,.32),rgba(240,207,122,.08) 40%,transparent 68%);animation:splH 3.2s ease-in-out infinite}
.spr{position:absolute;left:50%;top:50%;width:190%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:repeating-conic-gradient(rgba(240,207,122,.14) 0 4deg,transparent 4deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%);animation:splR 40s linear infinite}
.spi{position:relative;aspect-ratio:760/501;background:var(--logo) center/contain no-repeat;opacity:0;transform:scale(.86) translateY(10px);filter:drop-shadow(0 6px 18px rgba(0,0,0,.55));animation:splL 1s .1s cubic-bezier(.2,.8,.3,1) forwards}
.spi::after{content:"";position:absolute;inset:0;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.9) 50%,transparent 58%) 100% 0/250% 100% no-repeat;animation:splS 2.8s 1.2s ease-in-out infinite}
.spo{display:block;position:relative;height:2px;width:0;margin:16px auto 0;background:linear-gradient(90deg,transparent,#F0CF7A,transparent);animation:splO 1s 1s ease-out forwards}
.spo::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;translate:-50% -50%;rotate:45deg;background:#F0CF7A;box-shadow:0 0 10px #F0CF7A}
.spw b{position:absolute;left:var(--l);bottom:6%;width:3px;height:3px;border-radius:50%;background:#FFE7A3;box-shadow:0 0 6px 1px rgba(255,214,120,.8);opacity:0;animation:splP var(--d) ease-in infinite var(--t)}
.splb h1{background:linear-gradient(180deg,#FFF3C4,#E9C46A 55%,#B8862B);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes splL{to{opacity:1;transform:none}}@keyframes splH{50%{scale:1.08;opacity:.75}}@keyframes splR{to{rotate:360deg}}
@keyframes splS{0%{background-position:100% 0}55%,100%{background-position:0 0}}@keyframes splO{to{width:62%}}
@keyframes splP{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-190px)}}
@media (prefers-reduced-motion:reduce){.spi{opacity:1!important;transform:none!important}.spo{width:62%!important}}</style>
<title>تجربه زندگی متفاوت</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#EEF1FA;--card:#fff;--ink:#14173F;--mut:#5B6090;--line:#D9DEF0;--gold:#E9A02C;--tq:#1FA394;--shadow:0 10px 30px rgba(20,23,63,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1236;--card:#1A1E55;--ink:#F4F1FF;--mut:#A3A9DA;--line:#2B3070;--shadow:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1236;--card:#1A1E55;--ink:#F4F1FF;--mut:#A3A9DA;--line:#2B3070;--shadow:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Vazirmatn','Noto Sans Arabic','Segoe UI',Tahoma,sans-serif;display:flex;justify-content:center;min-height:100vh;min-height:100dvh}
#app{width:100%;max-width:440px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative}
main{flex:1;padding:22px 20px 110px}
h1{font-size:26px;font-weight:800;margin:0 0 2px;letter-spacing:0}
.sub{color:var(--mut);font-size:14px;margin:0 0 18px}
.week{display:flex;justify-content:space-between;margin-bottom:22px}
.day{width:38px;text-align:center;font-size:12px;color:var(--mut)}
.dot{width:30px;height:30px;border-radius:50%;margin:5px auto 0;border:2px dashed var(--line);display:grid;place-items:center;font-size:14px}
.dot.on{background:var(--gold);border:0;color:#14173F}
.dot.now{border:2px solid var(--gold)}
/* door */
.stage{position:relative;height:430px;border-radius:28px;overflow:hidden;background:radial-gradient(circle at 50% 38%,#3A3F9E 0%,#1B1F5E 55%,#0F1236 100%);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.6}
.doorwrap{perspective:900px;width:210px;height:320px;position:relative}
.glow{position:absolute;inset:18px 12px 0;border-radius:105px 105px 0 0;background:radial-gradient(circle at 50% 70%,#FFE9A8,#F2A33A 60%,#D9791E);filter:blur(.5px)}
.panel{position:absolute;inset:0;border-radius:105px 105px 6px 6px;background:linear-gradient(160deg,#2BB3A3,#12756B);border:5px solid var(--gold);transform-origin:right center;transition:transform 1s cubic-bezier(.6,0,.2,1);display:grid;place-items:center}
.panel::before{content:"";position:absolute;inset:16px;border-radius:90px 90px 4px 4px;border:2px solid rgba(255,255,255,.35)}
.open .panel{transform:rotateY(-78deg)}
.knob{width:16px;height:16px;border-radius:50%;background:var(--gold);position:absolute;left:22px;top:60%}
.hint{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#fff;font-weight:500;font-size:15px}
.pulse{animation:p 2.2s ease-in-out infinite}
@keyframes p{50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.panel{transition:none}}

function bkApply(m){const b=S.bk;if(!b)return;if(m=='r'){if(!S.rc){S.rc=1;render();return}S.j=b.j.slice();S.cm=b.cm.slice();if(b.p)S.p=b.p;if(b.rm)S.rm=b.rm}else{const ks=new Set(S.j.map(e=>e.ts+'|'+e.t));b.j.forEach(e=>{const k=e.ts+'|'+e.t;if(!ks.has(k)){ks.add(k);S.j.push(e)}});const ct=new Set(S.cm.map(x=>x.t));b.cm.forEach(x=>{if(!ct.has(x.t)){ct.add(x.t);S.cm.push(x)}})}
S.j.sort((a,c)=>c.ts-a.ts);S.bk=null;S.rc=0;S.bpaste='';S.bm='';S.cur=null;S.cur=nextI();render();toast('خاطرات بازیابی شد')}
function backupH(){const b=S.bk;return `<h3 id="bk">پشتیبان‌گیری و بازیابی</h3><p class="note">خاطرات فقط در حافظه‌ی مرورگر همین دستگاه می‌مانند و با پاک شدن داده‌ها از بین می‌روند. یک نسخه‌ی پشتیبان بگیر و هر وقت خواستی برگردان.</p>${S.sf?'<p class="note warn">حافظه‌ی مرورگر پر است و تغییرات تازه ذخیره نمی‌شوند. همین حالا پشتیبان بگیر.</p>':''}<div class="stat"><span>${S.lb?'آخرین پشتیبان: '+dl(S.lb):'هنوز پشتیبان نگرفته‌ای'}</span><div class="bkb" style="margin-top:12px">${DL?'<button class="pri" onclick="bkSave6()">💾 ذخیره‌ی فایل</button>':''}<button class="sec" onclick="bkCopy()">📋 کپی متن</button></div>${S.bx?`<p class="note">متن پشتیبان را کپی کن و جای امنی نگه دار.</p><textarea id="bkx" class="inp" readonly>${esc(S.bx)}</textarea>`:''}<h3 style="margin-top:20px">بازیابی</h3><label class="ph"><input type="file" accept=".json,application/json" hidden onchange="bkFile(this)">📂 انتخاب فایل پشتیبان</label><textarea id="bkp" class="inp" placeholder="یا متن پشتیبان را اینجا بچسبان…" oninput="S.bpaste=this.value">${esc(S.bpaste)}</textarea><button class="sec" style="width:100%" onclick="bkIn(S.bpaste||'')">بررسی متن</button>${S.bm?`<p class="note warn">${esc(S.bm)}</p>`:''}${b?`<div class="rem col" style="margin-top:12px;box-shadow:none;background:var(--bg)"><b>${fa(b.j.length)} خاطره و ${fa(b.cm.length)} ماموریت دلخواه پیدا شد</b>${b.ts?`<span class="note">ساخته‌شده در ${new Date(b.ts).toLocaleDateString('fa-IR',{day:'numeric',month:'long',year:'numeric'})}</span>`:''}<div class="btns"><button class="pri" onclick="bkApply('m')">ادغام با فعلی</button><button class="sec" onclick="bkApply('r')">${S.rc?'⚠️ تأیید':'جایگزینی'}</button></div><span class="note">«ادغام» خاطره‌های تکراری را دوباره اضافه نمی‌کند. «جایگزینی» همه‌ی خاطرات فعلی را پاک می‌کند${S.rc?'؛ برای ادامه دوباره بزن':''}.</span><button class="sec" onclick="S.bk=null;S.rc=0;render()">انصراف</button></div>`:''}</div>`}

/* ---------- sky / terrain ---------- */
function terrain(P,id,b,n){
const sp=(typeof skyPos=='function')?skyPos():{x:50,y:30},ox=clamp(sp.x*6,40,560),oy=40+(sp.y-15)*2.4;
const night=b=='night',stars=night?70:(b=='dawn'||b=='sunset'?26:0);
let st='';for(let i=0;i<stars;i++)st+=`<circle cx="${f1(R(i,1)*WW)}" cy="${f1(R(i,2)*230)}" r="${f1(.5+R(i,3)*1.2)}" fill="#fff" opacity="${f1(.35+R(i,4)*.6)}">${i%4?'':`<animate attributeName="opacity" values="${f1(.9)};.2;${f1(.9)}" dur="${2+R(i,5)*3}s" repeatCount="indefinite"/>`}</circle>`;
const orb=night?`<g filter="url(#gl${id})"><circle cx="${ox}" cy="${oy}" r="17" fill="#EEF2FF"/><circle cx="${ox+7}" cy="${oy-4}" r="14" fill="${P.sky[1]}"/></g>`:`<g filter="url(#gl${id})"><circle cx="${ox}" cy="${oy}" r="${b=='day'?22:28}" fill="${b=='day'?'#FFF3B0':'#FFC27A'}" opacity=".95"/></g>`;
const cap=(x,y,w,h)=>`<path d="M${x} ${y} l${-w} ${h} l${w*.35} ${-h*.2} l${w*.3} ${h*.28} l${w*.35} ${-h*.3} l${w*.35} ${h*.22}Z" fill="#fff" opacity="${P.snow}"/>`;
return `<rect width="${WW}" height="${WH}" fill="url(#sk${id})"/>${st}${orb}
<path d="M0 200 L40 150 L80 178 L130 110 L180 160 L230 96 L290 150 L350 70 L410 142 L470 100 L520 150 L560 120 L600 160 L600 300 L0 300Z" fill="${P.far}"/>
${cap(130,110,26,28)}${cap(230,96,30,32)}${cap(350,70,36,44)}${cap(470,100,26,28)}
<path d="M0 235 L70 185 L120 210 L190 150 L250 205 L330 128 L360 118 L420 186 L480 160 L540 205 L600 170 L600 320 L0 320Z" fill="${P.mid}"/>
<path d="M330 128 L360 118 L392 160 L350 150Z" fill="#fff" opacity="${P.snow*.9}"/>
<path d="M0 275 Q90 235 180 262 T360 250 T600 262 L600 340 L0 340Z" fill="${P.hill}"/>
<path d="M0 320 Q150 290 300 312 T600 300 L600 960 L0 960Z" fill="url(#gr${id})"/>
<rect y="236" width="${WW}" height="110" fill="${P.haze}" opacity=".7"/>`}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const GRD={day:'#FFE7A8',dawn:'#FF9A7A',sunset:'#FF6A5A',night:'#2A3FD0'};
const BN={day:'☀️ تهران، روز',dawn:'🌅 تهران، سحر',sunset:'🌇 تهران، غروب',night:'🌃 تهران، شب'};
function wdDefs(id,b){return `<linearGradient id="gd${id}" x1="0" y1="0" x2="0" y2="1"><stop offset=".2" stop-color="${GRD[b]}" stop-opacity="0"/><stop offset="1" stop-color="${GRD[b]}" stop-opacity=".9"/></linearGradient><radialGradient id="hl${id}"><stop offset="0" stop-color="#FFE9A8" stop-opacity=".9"/><stop offset="1" stop-color="#FFE9A8" stop-opacity="0"/></radialGradient><radialGradient id="cg${id}"><stop offset="0" stop-color="#FFB347" stop-opacity=".6"/><stop offset="1" stop-color="#FFB347" stop-opacity="0"/></radialGradient><linearGradient id="ry${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3C4" stop-opacity=".6"/><stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/></linearGradient><linearGradient id="bm${id}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#E8F0FF" stop-opacity=".7"/><stop offset="1" stop-color="#E8F0FF" stop-opacity="0"/></linearGradient><filter id="bl${id}" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="2.4"/></filter>`}
function atmo(P,id,b,n){
const sp=(typeof skyPos=='function')?skyPos():{x:50,y:30},ox=clamp(sp.x*6,40,560),oy=40+(sp.y-15)*2.4,nt=b=='night';
const cc=nt?'#9FB0FF':b=='day'?'#fff':b=='dawn'?'#FFD2C0':'#FFC0A0',co=nt?.22:b=='day'?.9:.72;
let s=`<rect width="${WW}" height="${WH}" fill="url(#gd${id})" style="mix-blend-mode:soft-light" opacity=".85"/>`;
if(!nt){s+=`<g style="mix-blend-mode:screen">`;for(let k=0;k<6;k++){const dx=(k-2.5)*80,w=12+(k%3)*9;s+=`<path d="M${f1(ox)} ${f1(oy)} L${f1(ox+dx-w)} 440 L${f1(ox+dx+w)} 440Z" fill="url(#ry${id})" opacity=".55"><animate attributeName="opacity" values=".25;.6;.25" dur="${5+k}s" begin="-${k}s" repeatCount="indefinite"/></path>`}s+='</g>'}
for(let i=0;i<6;i++){const y=34+i*36+R(i,7)*18,sc=.7+R(i,8)*.9;s+=`<g transform="translate(0 ${f1(y)}) scale(${f1(sc)})" fill="${cc}" opacity="${f1(co*(.55+R(i,9)*.45))}" filter="url(#bl${id})"><g><ellipse rx="34" ry="11"/><ellipse cx="-20" cy="-6" rx="20" ry="12"/><ellipse cx="6" cy="-13" rx="22" ry="14"/><ellipse cx="26" cy="-4" rx="18" ry="10"/><animateTransform attributeName="transform" type="translate" from="-140 0" to="${f1(760/sc)} 0" dur="${70+i*24}s" begin="-${i*19}s" repeatCount="indefinite"/></g></g>`}
if(!nt)for(let i=0;i<4;i++){s+=`<g stroke="${P.ink}" stroke-width="1.5" fill="none" opacity=".6" stroke-linecap="round"><path d="M0 0 q4 -6 8 0 q4 -6 8 0"><animate attributeName="d" values="M0 0 q4 -6 8 0 q4 -6 8 0;M0 0 q4 3 8 0 q4 3 8 0;M0 0 q4 -6 8 0 q4 -6 8 0" dur=".7s" repeatCount="indefinite"/></path><animateTransform attributeName="transform" type="translate" from="-30 ${96+i*24}" to="640 ${70+i*30}" dur="${26+i*7}s" begin="-${i*9}s" repeatCount="indefinite"/></g>`}
else s+=`<g stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M0 0 l-34 14" stroke-opacity=".9"/><animateTransform attributeName="transform" type="translate" from="540 20" to="320 120" dur="7s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.7;.78;.92;1" dur="7s" begin="2s" repeatCount="indefinite"/></g>`;
if(n>0)s+=`<ellipse cx="${HX}" cy="${HY}" rx="${120+Math.min(n,70)*3}" ry="${70+Math.min(n,70)*1.6}" fill="url(#cg${id})" opacity="${nt?1:b=='day'?.14:.65}"/>`;
if(n>=12&&!(b=='day'))s+=`<g transform="translate(188 258)" style="mix-blend-mode:screen" opacity="${nt?1:.55}"><path d="M0 0 L-16 -170 L16 -170Z" fill="url(#bm${id})"><animateTransform attributeName="transform" type="rotate" values="-34;34;-34" dur="10s" repeatCount="indefinite"/></path><path d="M0 0 L-12 -150 L12 -150Z" fill="url(#bm${id})"><animateTransform attributeName="transform" type="rotate" values="30;-30;30" dur="8s" repeatCount="indefinite"/></path></g>`;
const M=Math.min(26,Math.floor(n/2));for(let i=0;i<M;i++){const x=20+R(i,61)*560,y=340+R(i,62)*580;s+=`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(1+R(i,63)*1.4)}" fill="#FFE9A8" filter="url(#gl0)" opacity="0"><animate attributeName="opacity" values="0;.9;0" dur="${3+R(i,64)*4}s" begin="-${f1(R(i,65)*4)}s" repeatCount="indefinite"/><animate attributeName="cy" values="${f1(y)};${f1(y-30)}" dur="${3+R(i,64)*4}s" begin="-${f1(R(i,65)*4)}s" repeatCount="indefinite"/></circle>`}
return s}
function halo(id,l,b,isNew){const o=b=='night'?.85:b=='day'?.16:.5,cy=l.y-22*l.s;return `<circle cx="${l.x}" cy="${f1(cy)}" r="${l.id=='milad'?74:62}" fill="url(#hl${id})" opacity="${o}" pointer-events="none"><animate attributeName="opacity" values="${o};${f1(o*.55)};${o}" dur="${3.5+l.t%3}s" repeatCount="indefinite"/></circle>`+(isNew?`<circle cx="${l.x}" cy="${f1(cy)}" r="10" fill="none" stroke="#FFE9A8" stroke-width="3" pointer-events="none"><animate attributeName="r" values="10;100" dur="1.6s" repeatCount="3"/><animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="3"/></circle>`:'')}
